<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Moodify</title>

<style>
/* -----------------------------------------
   GLOBAL STYLING + PREMIUM BACKGROUND
------------------------------------------*/
body {
    margin: 0;
    font-family: 'Poppins', sans-serif;
    color: white;
    overflow-x: hidden;
    transition: background 1s ease-in-out;
}

/* Animated gradient that changes by adding classes */
.bg-normal {
    background: linear-gradient(135deg, #003b44, #00515c, #008c93);
    background-size: 400% 400%;
    animation: gradientMove 10s ease infinite;
}

.bg-happy {
    background: linear-gradient(135deg, rgb(76, 10, 34), rgb(101, 86, 120));
    background-size: 400% 400%;
    animation: gradientMove 10s ease infinite;
}

.bg-sad {
    background: linear-gradient(135deg, #002f4d, #004e89, #001f33);
    background-size: 400% 400%;
    animation: gradientMove 10s ease infinite;
}

.bg-chill {
background: linear-gradient(135deg, #ffe082, #ffca28);

    background-size: 400% 400%;
    animation: gradientMove 10s ease infinite;
}

@keyframes gradientMove {
    0% {background-position: 0% 50%}
    50% {background-position: 100% 50%}
    100% {background-position: 0% 50%}
}

/* -----------------------------------------
   UI ELEMENTS
------------------------------------------*/

h1 {
    font-size: 32px;
    font-weight: 700;
    padding: 25px;
    opacity: 0.9;
}

.detect-card {
    width: 86%;
    margin: auto;
    background: rgba(255,255,255,0.08);
    border-radius: 28px;
    text-align: center;
    padding: 40px 20px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.4);
    backdrop-filter: blur(12px);
    cursor: pointer;
    transition: transform 0.3s ease;
}
.detect-card:hover {
    transform: scale(1.04);
}

.detect-icon {
    font-size: 95px;
    animation: pulse 2s infinite;
}

@keyframes pulse {
    0% { transform: scale(1); opacity: 0.7;}
    50% { transform: scale(1.15); opacity: 1;}
    100% { transform: scale(1); opacity: 0.7;}
}

.section-title {
    margin-left: 20px;
    margin-top: 40px;
    font-size: 22px;
    opacity: .85;
}

.mood-grid {
    display: flex;
    justify-content: space-around;
    margin-top: 25px;
}

.mood-btn {
    background: rgba(255,255,255,0.1);
    padding: 20px;
    width: 70px;
    border-radius: 18px;
    text-align: center;
    transition: 0.3s;
    backdrop-filter: blur(8px);
    cursor: pointer;
}
.mood-btn:hover {
    transform: translateY(-6px);
}

.player-screen {
    display: none;
    padding-top: 20px;
}

.player-card {
    width: 86%;
    margin: auto;
    background: rgba(0,0,0,0.35);
    padding: 20px;
    border-radius: 25px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.5);
    backdrop-filter: blur(10px);
    animation: fadeIn 0.7s ease;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px);}
    to   { opacity: 1; transform: translateY(0);}
}

/* 3D Album Poster */
.album-img {
    width: 100%;
    border-radius: 20px;
    transform: perspective(700px) rotateY(8deg);
    transition: transform 0.5s ease;
}
.album-img:hover {
    transform: perspective(700px) rotateY(0deg) scale(1.05);
}

.mood-status {
    text-align: center;
    font-size: 28px;
    margin-top: 15px;
    font-weight: 600;
}

.player-controls {
    margin-top: 25px;
    display: flex;
    justify-content: center;
    gap: 25px;
}

.player-controls button {
    background: rgba(255,255,255,0.9);
    border: none;
    padding: 15px;
    width: 55px;
    height: 55px;
    border-radius: 50%;
    font-size: 20px;
    color: #004d54;
    font-weight: 700;
    transition: 0.3s;
}
.player-controls button:hover {
    transform: scale(1.12);
}

.progress {
    width: 90%;
    margin: 20px auto;
}

/* Bottom Navigation */
.bottom-nav {
    width: 100%;
    position: fixed;
    bottom: 0;
    padding: 15px;
    display: flex;
    justify-content: space-around;
    background: rgba(0,0,0,0.35);
    backdrop-filter: blur(14px);
}

.bottom-nav img {
    width: 40px;
    opacity: .85;
}

/* Camera */
#cameraBox {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.9);
    backdrop-filter: blur(12px);
    padding-top: 90px;
    color: white;
    text-align: center;
}

video {
    width: 85%;
    border-radius: 20px;
    border: 3px solid white;
}

#countdown {
    font-size: 55px;
    margin-top: 25px;
}
</style>
</head>

<body class="bg-normal">

<h1>Moodify</h1>

<div id="homeScreen">
    <div class="detect-card" id="detectBtn">
        <div class="detect-icon">📷</div>
        <div class="detect-text">Detect Mood</div>
    </div>

    <h2 class="section-title">Select Manually</h2>

    <div class="mood-grid">
        <div class="mood-btn" onclick="openPlayer('Normal')">🙂<p>Normal</p></div>
        <div class="mood-btn" onclick="openPlayer('Happy')">😊<p>Happy</p></div>
        <div class="mood-btn" onclick="openPlayer('Sad')">😞<p>Sad</p></div>
        <div class="mood-btn" onclick="openPlayer('Chill')">🥂<p>Chill</p></div>
    </div>
</div>

<!-- PLAYER -->
<div id="playerScreen" class="player-screen">
    <div class="player-card">
        <img id="albumArt" class="album-img">
        <div id="moodDisplay" class="mood-status">Mood : Normal</div>

        <div class="player-controls">
            <button onclick="prevSong()">⏮</button>
            <button onclick="togglePlay()">▶</button>
            <button onclick="nextSong()">⏭</button>
        </div>

        <input type="range" class="progress" id="progressBar">
    </div>
</div>

<div class="bottom-nav">     <!-- Home Icon -->     <svg onclick="goHome()" width="35" height="35" viewBox="0 0 24 24" fill="#fff" style="cursor:pointer;">         <path d="M3 9.5L12 3l9 6.5V21a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1V9.5z"/>     </svg>

<!-- Double Music Note Icon -->
<svg onclick="goPlayer()" width="36" height="36" viewBox="0 0 24 24" fill="#fff" style="cursor:pointer;">
    <path d="M9 3v12a3 3 0 1 0 2 2.83V7h6V3H9zm10 4v9a3 3 0 1 0 2 2.83V7h-2z"/>
</s
vg>


<div id="cameraBox">
    <video id="camera" autoplay></video>
    <div id="countdown">5</div>
</div>


<script>
/* SONG DATABASE (Your file format maintained) */
let moodSongs = {
    Normal: [
        {url: "song1.mp3", img: "poster1.jpg"},
        {url: "song2.mp3", img: "poster2.jpg"},
        {url: "song3.mp3", img: "poster3.jpg"},
        {url: "song4.mp3", img: "poster4.jpg"},
    ],

    Happy: [
        {url: "happy1.mp3", img: "happyPoster1.jpg"},
        {url: "happy2.mp3", img: "happyPoster2.jpg"},
        {url: "happy3.mp3", img: "happyPoster3.jpg"},
        {url: "happy4.mp3", img: "happyPoster4.jpg"},
    ],

    Sad: [
        {url: "sad1.mp3", img: "sadPoster1.jpg"},
        {url: "sad2.mp3", img: "sadPoster2.jpg"},
        {url: "sad3.mp3", img: "sadPoster3.jpg"},
        {url: "sad4.mp3", img: "sadPoster4.jpg"},
    ],

    Chill: [
        {url: "chill1.mp3", img: "chillPoster1.jpg"},
        {url: "chill2.mp3", img: "chillPoster2.jpg"},
        {url: "chill3.mp3", img: "chillPoster3.jpg"},
        {url: "chill4.mp3", img: "chillPoster4.jpg"},
    ]
};

let currentMood = "Normal";
let currentSong = new Audio();
let songIndex = 0;

/* HOME & PLAYER SWITCH */
function goHome() {
    homeScreen.style.display = "block";
    playerScreen.style.display = "none";
}
function goPlayer() {
    homeScreen.style.display = "none";
    playerScreen.style.display = "block";
}

/* SET BACKGROUND ACCORDING TO MOOD */
function updateBackground(mood) {
    document.body.className = "";  
    document.body.classList.add("bg-" + mood.toLowerCase());
}

/* OPEN PLAYER */
function openPlayer(mood) {
    currentMood = mood;
    songIndex = 0;

    moodDisplay.innerText = "Mood : " + mood;
    updateBackground(mood);

    goPlayer();
    playSong();
}

/* PLAY SONG */
function playSong() {
    let songList = moodSongs[currentMood];
    currentSong.src = songList[songIndex].url;
    albumArt.src = songList[songIndex].img;
    currentSong.play();
}

function nextSong() {
    let list = moodSongs[currentMood];
    songIndex = (songIndex + 1) % list.length;
    playSong();
}

function prevSong() {
    let list = moodSongs[currentMood];
    songIndex = (songIndex - 1 + list.length) % list.length;
    playSong();
}

function togglePlay() {
    if (currentSong.paused) currentSong.play();
    else currentSong.pause();
}

/* CAMERA MOOD DETECTION */
detectBtn.onclick = async () => {
    cameraBox.style.display = "block";

    let stream = await navigator.mediaDevices.getUserMedia({video:true});
    camera.srcObject = stream;

    let count = 5;
    countdown.innerText = count;

    let interval = setInterval(() => {
        count--;
        countdown.innerText = count;

        if (count === 0) {
            clearInterval(interval);
            stream.getTracks()[0].stop();
            cameraBox.style.display = "none";

            // Fake detection logic
            let detectedMood = ["Normal","Happy","Sad","Chill"][Math.floor(Math.random()*4)];

            openPlayer(detectedMood);
        }
    }, 1000);
};
</script>

</body>
</html>
