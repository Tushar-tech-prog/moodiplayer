<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Moodify Premium</title>

<style>
/* ------------------- GLOBAL UI ------------------- */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Poppins", sans-serif;
}

    


body {
    background: linear-gradient(135deg, #012b32, #004b59);
    transition: background 1s ease-in-out;
    color: white;
    overflow-x: hidden;
    padding-bottom: 80px;
}

/* ------------------- TITLE ------------------- */
h1 {
    padding: 25px;
    font-size: 34px;
    color: #aef9ff;
    font-weight: 700;
    letter-spacing: 1px;
}

/* ------------------- DETECT CARD ------------------- */
.detect-card {
    width: 86%;
    margin: auto;
    background: rgba(0, 195, 255, 0.15);
    border: 1px solid rgba(0,255,255,0.3);
    border-radius: 30px;
    padding: 45px 20px;
    text-align: center;
    backdrop-filter: blur(12px);
    box-shadow: 0 8px 25px rgba(0,255,255,0.25);
    cursor: pointer;
    transition: .3s;
}

.detect-card:hover {
    transform: scale(1.03);
    box-shadow: 0 10px 30px rgba(0,255,255,0.35);
}

.detect-icon {
    font-size: 95px;
}

.detect-text {
    margin-top: 15px;
    font-size: 28px;
    letter-spacing: 1px;
}

/* ------------------- MOOD GRID ------------------- */
.section-title {
    margin-left: 22px;
    margin-top: 35px;
    font-size: 22px;
    opacity: .85;
}

.mood-grid {
    display: flex;
    justify-content: space-around;
    margin-top: 25px;
}

.mood-btn {
    width: 75px;
    padding: 18px;
    border-radius: 18px;
    text-align: center;
    background: rgba(0, 200, 255, 0.15);
    border: 1px solid rgba(0,255,255,0.25);
    backdrop-filter: blur(8px);
    cursor: pointer;
    transition: .3s;
}

.mood-btn:hover {
    transform: translateY(-5px);
    box-shadow: 0 8px 20px rgba(0,255,255,0.4);
}

.mood-btn p {
    margin-top: 5px;
    font-size: 14px;
}

/* ------------------- PLAYER ------------------- */
.player-screen {
    display: none;
    padding-top: 20px;
}

.player-card {
    width: 86%;
    margin: auto;
    background: rgba(0, 255, 255, 0.12);
    border-radius: 28px;
    padding: 22px;
    backdrop-filter: blur(10px);
    border: 1px solid rgba(0,255,255,0.25);
    box-shadow: 0 8px 25px rgba(0,255,255,0.25);
    animation: fadeIn .6s ease;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px);}
    to { opacity: 1; transform: translateY(0);}
}

/* Album Art 3D */
.album-img {
    width: 100%;
    border-radius: 22px;
    transition: .4s;
    transform: perspective(800px) rotateY(8deg);
    box-shadow: 0 12px 35px rgba(0,255,255,0.35);
}

.album-img:hover {
    transform: perspective(800px) rotateY(0deg) scale(1.03);
    box-shadow: 0 20px 55px rgba(0,255,255,0.45);
}

/* Mood Label */
.mood-status {
    text-align: center;
    font-size: 25px;
    margin-top: 18px;
    font-weight: 600;
    letter-spacing: 1px;
    text-shadow: 0px 0px 10px cyan;
}

/* Controls */
.player-controls {
    display: flex;
    justify-content: center;
    gap: 30px;
    margin-top: 22px;
}

.player-controls button {
    width: 60px;
    height: 60px;
    border-radius: 50%;
    border: none;
    background: #aef9ff;
    color: #003239;
    font-size: 22px;
    font-weight: 600;
    box-shadow: 0 5px 20px rgba(0,255,255,0.3);
    cursor: pointer;
    transition: .25s;
}

.player-controls button:hover {
    transform: scale(1.12);
    box-shadow: 0 8px 25px rgba(0,255,255,0.5);
}

.progress {
    width: 90%;
    margin: 20px auto;
}

/* ------------------- NAV ------------------- */
.bottom-nav {
    position: fixed;
    bottom: 0;
    width: 100%;
    padding: 15px;
    background: rgba(0,255,255,0.1);
    border-top: 1px solid rgba(0,255,255,0.3);
    backdrop-filter: blur(10px);
    display: flex;
    justify-content: space-around;
}

.bottom-nav img {
    width: 38px;
}

/* ------------------- CAMERA BOX ------------------- */
#cameraBox {
    position: fixed;
    display: none;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0,25,30,0.9);
    backdrop-filter: blur(12px);
    text-align: center;
    padding-top: 80px;
}

#camera {
    width: 85%;
    border-radius: 20px;
    border: 3px solid cyan;
}

#countdown {
    font-size: 55px;
    margin-top: 20px;
    font-weight: 700;
    text-shadow: 0px 0px 15px cyan;
}

</style>
</head>

<body>


    

    

<!-- HOME SCREEN -->
<div id="homeScreen">
    <div class="detect-card" id="detectBtn">
        <div class="detect-icon">📷</div>
        <div class="detect-text">Detect Mood</div>
    </div>

    <h2 class="section-title">Select Manually</h2>

    <div class="mood-grid">
        <div class="mood-btn" onclick="openPlayer('Normal')">🙂<p>Normal</p></div>
        <div class="mood-btn" onclick="openPlayer('Happy')">😊<p>Happy</p></div>
        <div class="mood-btn" onclick="openPlayer('Sad')">😞<p>Sad</p></div>
        <div class="mood-btn" onclick="openPlayer('Chill')">😌<p>Chill</p></div>
    </div>
</div>

<!-- PLAYER SCREEN -->
<div id="playerScreen" class="player-screen">
    <div class="player-card">
        <img id="albumArt" class="album-img">
        <div id="moodDisplay" class="mood-status">Mood : Normal</div>

        <div class="player-controls">
            <button onclick="prevSong()">⏮</button>
            <button onclick="togglePlay()">▶</button>
            <button onclick="nextSong()">⏭</button>
        </div>

        <input type="range" id="progressBar" class="progress">
    </div>
</div>

<!-- BOTTOM NAV -->
<div class="bottom-nav">     <!-- Home Icon -->     <svg onclick="goHome()" width="35" height="35" viewBox="0 0 24 24" fill="#fff" style="cursor:pointer;">         <path d="M3 9.5L12 3l9 6.5V21a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1V9.5z"/>     </svg>
<!-- Stylish Rounded Music Icon -->
<svg onclick="goPlayer()" width="36" height="36" viewBox="0 0 24 24" fill="#fff" style="cursor:pointer;">
    <path d="M12 3v9.26A4 4 0 1 0 14 16V7h6V3h-8z" />
</s
vg>
    

<!-- CAMERA BOX -->
<div id="cameraBox">
    <video id="camera" autoplay></video>
    <div id="countdown">5</div>
</div>

<script>
/* ------------------------ SONG DB ------------------------ */
let moodSongs = {
    Normal: [
        {url:"song1.mp3", img:"poster1.jpg"},
        {url:"song2.mp3", img:"poster2.jpg"},
        {url:"song3.mp3", img:"poster3.jpg"},
        {url:"song4.mp3", img:"poster4.jpg"},
    ],
    Happy: [
        {url:"happy1.mp3", img:"happyPoster1.jpg"},
        {url:"happy2.mp3", img:"happyPoster2.jpg"},
        {url:"happy3.mp3", img:"happyPoster3.jpg"},
        {url:"happy4.mp3", img:"happyPoster4.jpg"},
    ],
    Sad: [
        {url:"sad1.mp3", img:"sadPoster1.jpg"},
        {url:"sad2.mp3", img:"sadPoster2.jpg"},
        {url:"sad3.mp3", img:"sadPoster3.jpg"},
        {url:"sad4.mp3", img:"sadPoster4.jpg"},
    ],
    Chill: [
        {url:"chill1.mp3", img:"chillPoster1.jpg"},
        {url:"chill2.mp3", img:"chillPoster2.jpg"},
        {url:"chill3.mp3", img:"chillPoster3.jpg"},
        {url:"chill4.mp3", img:"chillPoster4.jpg"},
    ]
};

let currentMood = "Normal";
let currentSong = new Audio();
let songIndex = 0;

/* ------------------------ NAV ------------------------ */
function goHome() {
    homeScreen.style.display = "block";
    playerScreen.style.display = "none";
}

function goPlayer() {
    homeScreen.style.display = "none";
    playerScreen.style.display = "block";
}

/* ------------------------ MOOD BACKGROUND ------------------------ */
function updateBackground(mood){
    let bg = {
        Normal: "linear-gradient(135deg,#01333b,#005a63)",
        Happy:  "linear-gradient(135deg,#006b7b,#00c6ff)",
        Sad:    "linear-gradient(135deg,#012027,#003b44)",
        Chill:  "linear-gradient(135deg,#01565e,#00a2b0)"
    };
    document.body.style.background = bg[mood];
}

/* ------------------------ PLAYER ------------------------ */
function openPlayer(mood){
    currentMood = mood;
    moodDisplay.innerText = "Mood : " + mood;
    updateBackground(mood);

    songIndex = Math.floor(Math.random()*4);
    goPlayer();
    playSong();
}

function playSong(){
    let list = moodSongs[currentMood];
    albumArt.src = list[songIndex].img;
    currentSong.src = list[songIndex].url;
    currentSong.play();
}

function nextSong(){
    let list = moodSongs[currentMood];
    songIndex = (songIndex + 1) % list.length;
    playSong();
}

function prevSong(){
    let list = moodSongs[currentMood];
    songIndex = (songIndex - 1 + list.length) % list.length;
    playSong();
}

function togglePlay(){
    if(currentSong.paused) currentSong.play();
    else currentSong.pause();
}

/* ------------------------ CAMERA DETECT ------------------------ */
detectBtn.onclick = async ()=>{
    cameraBox.style.display = "block";

    let stream = await navigator.mediaDevices.getUserMedia({video:true});
    camera.srcObject = stream;

    let count = 5;
    countdown.innerText = count;

    let timer = setInterval(()=>{
        count--;
        countdown.innerText = count;

        if(count === 0){
            clearInterval(timer);
            stream.getTracks()[0].stop();
            cameraBox.style.display = "none";

            let detected = ["Normal","Happy","Sad","Chill"][Math.floor(Math.random()*4)];
            openPlayer(detected);
        }
    },1000);
};
</script>

</body>
</html>
