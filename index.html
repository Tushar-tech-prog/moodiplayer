<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Moodify</title>

<style>
/* ========= ROOT COLORS ========= */
:root{
    --aqua:#00eaff;
    --aqua-light:#7af7ff;
    --dark-bg:#031f26;
    --card-bg:rgba(255,255,255,0.08);
    --white:#fff;
    --shadow:0px 0px 25px rgba(0,255,255,0.35);
}

/* ========= GLOBAL ========= */
body{
    margin:0;
    padding:0;
    font-family: 'Poppins', sans-serif;
    background: var(--dark-bg);
    transition: background 0.8s ease;
    overflow-x:hidden;
    color:white;
}

h2{
    margin:0;
}

/* ========= HEADER ========= */
.header{
    padding:20px;
    font-size:32px;
    font-weight:700;
    color:var(--aqua);
    letter-spacing:1px;
}

/* ========= ALBUM CARD ========= */
.card{
    width:90%;
    margin:auto;
    background:var(--card-bg);
    border-radius:25px;
    padding:25px;
    text-align:center;
    backdrop-filter:blur(12px);
    box-shadow:var(--shadow);
    transition:0.4s;
}

.card:hover{
    transform:scale(1.02) rotateX(4deg);
}

/* Album Image */
.album{
    width:100%;
    border-radius:20px;
    transition:0.3s;
}

/* Mood title */
#moodText{
    margin-top:20px;
    font-size:24px;
    font-weight:600;
    color:var(--aqua);
}

/* Controls */
.controls{
    margin-top:20px;
    display:flex;
    justify-content:center;
    gap:30px;
    font-size:32px;
}

.controls i{
    color:var(--aqua-light);
    cursor:pointer;
    transition:0.2s;
}

.controls i:hover{
    transform:scale(1.2);
}

/* Progress bar */
.bar{
    width:80%;
    margin:20px auto;
    height:6px;
    background:#0b2f36;
    border-radius:10px;
    position:relative;
}

.bar .dot{
    width:18px;
    height:18px;
    background:var(--aqua);
    border-radius:50%;
    position:absolute;
    top:-6px;
    left:20%;
    box-shadow:var(--shadow);
}

/* ========= PLAYLIST BUTTON ========= */
.playlist-btn{
    width:120px;
    margin:20px;
    padding:12px;
    border:2px solid var(--aqua);
    border-radius:15px;
    text-align:center;
    font-size:18px;
    color:var(--aqua);
    cursor:pointer;
}

/* ========= BOTTOM NAV ========= */
.bottom{
    width:100%;
    height:60px;
    position:fixed;
    bottom:0;
    left:0;
    border-top:1px solid rgba(255,255,255,0.2);
    display:flex;
    justify-content:space-around;
    align-items:center;
    background:rgba(0,0,0,0.25);
    backdrop-filter:blur(12px);
}

.bottom i{
    font-size:30px;
    color:var(--aqua-light);
}

/* ========= MOOD SELECT MODAL ========= */
.mood-container{
    width:100%;
    margin-top:20px;
    text-align:center;
}

.moods{
    display:flex;
    justify-content:space-around;
    margin-top:15px;
}

.mood-btn{
    background:var(--card-bg);
    padding:15px;
    border-radius:15px;
    width:70px;
    color:var(--aqua-light);
    font-size:14px;
    cursor:pointer;
    box-shadow:0px 0px 10px rgba(0,255,255,0.2);
}

/* Camera detect */
.camera-btn{
    margin:auto;
    margin-top:30px;
    width:150px;
    padding:18px;
    border-radius:20px;
    background:var(--card-bg);
    text-align:center;
    font-size:18px;
    cursor:pointer;
    color:var(--aqua-light);
    box-shadow:var(--shadow);
}

/* ========= MOOD BACKGROUNDS ========= */
.normal-bg{ background:#051b20; }
.happy-bg{ background:#05383f; }
.sad-bg{ background:#011014; }
.chill-bg{ background:#042e2a; }

/* Animated Gradient Glow */
body.glow{
    animation:bgPulse 6s infinite alternate;
}

@keyframes bgPulse{
    0%{ filter:brightness(1); }
    100%{ filter:brightness(1.25); }
}

</style>
</head>
<body class="normal-bg">

<div class="header">Moodify</div>

<!-- Album Section -->
<div class="card">
    <img id="albumArt" src="https://i.postimg.cc/GtHv6Vzk/album1.jpg" class="album">

    <div id="moodText">Mood: Normal</div>

    <div class="controls">
        <i onclick="prev()">⏮</i>
        <i onclick="playPause()">⏯</i>
        <i onclick="next()">⏭</i>
    </div>

    <div class="bar">
        <div class="dot"></div>
    </div>
</div>

<div class="playlist-btn">Playlist</div>

<!-- Mood Selection -->
<div class="mood-container">

    <div class="camera-btn" onclick="detectMood()">📷 Detect Mood</div>

    <h3 style="margin-top:30px;">Select Manually</h3>

    <div class="moods">
        <div class="mood-btn" onclick="setMood('Normal')">🙂 Normal</div>
        <div class="mood-btn" onclick="setMood('Happy')">😄 Happy</div>
        <div class="mood-btn" onclick="setMood('Sad')">😢 Sad</div>
        <div class="mood-btn" onclick="setMood('Chill')">😎 Chill</div>
    </div>

</div>

<!-- Bottom Nav -->
<div class="bottom">
    <i>🙂</i>
    <i>🎵</i>
</div>

<script>
/* SONG DATABASE */
const songs = {
    Normal:[
        {img:"https://i.postimg.cc/GtHv6Vzk/album1.jpg"},
        {img:"https://i.postimg.cc/NG8pBkq4/album2.jpg"},
        {img:"https://i.postimg.cc/nzV5hL0H/album3.jpg"}
    ],
    Happy:[
        {img:"https://i.postimg.cc/XXfWM3vQ/happy1.jpg"},
        {img:"https://i.postimg.cc/T1cP8CJ4/happy2.jpg"}
    ],
    Sad:[
        {img:"https://i.postimg.cc/52NTXvT8/sad1.jpg"},
        {img:"https://i.postimg.cc/sDYpznZ5/sad2.jpg"}
    ],
    Chill:[
        {img:"https://i.postimg.cc/fLWKM2Yw/chill1.jpg"},
        {img:"https://i.postimg.cc/8Cxfx7f0/chill2.jpg"}
    ]
};

let currentMood="Normal";

/* MOOD SETTER */
function setMood(m){
    currentMood = m;
    document.getElementById("moodText").innerText="Mood: "+m;
    randomSong(m);

    /* BG change */
    document.body.className="";
    document.body.classList.add(m.toLowerCase()+"-bg","glow");
}

/* RANDOM SONG PICKER */
function randomSong(m){
    let list = songs[m];
    let pick = list[Math.floor(Math.random()*list.length)];
    document.getElementById("albumArt").src = pick.img;
}

/* CAMERA MOOD SIMULATION */
function detectMood(){
    document.getElementById("moodText").innerText="Detecting...";
    setTimeout(()=>{
        setMood("Happy");
    },3000);
}

/* PLAYER CONTROLS */
function playPause(){ alert("Play/Pause clicked"); }
function next(){ randomSong(currentMood); }
function prev(){ randomSong(currentMood); }

</script>
</body>
</html>
