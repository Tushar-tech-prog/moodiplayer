<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Moodify</title>

<style>
    body {
        margin: 0;
        font-family: 'Poppins', sans-serif;
        background: #003b44;
        color: white;
        overflow-x: hidden;
    }

    h1 {
        text-align: left;
        font-size: 32px;
        font-weight: 700;
        padding: 25px;
    }

    .detect-card {
        width: 86%;
        margin: auto;
        background: rgba(0, 65, 75, 0.8);
        border-radius: 28px;
        text-align: center;
        padding: 40px 20px;
        box-shadow: 0 8px 25px rgba(0,0,0,0.4);
        margin-top: 10px;
    }

    .detect-icon {
        font-size: 90px;
        opacity: 0.85;
    }

    .detect-text {
        margin-top: 20px;
        font-size: 28px;
    }

    .section-title {
        margin-left: 20px;
        margin-top: 40px;
        font-size: 22px;
        opacity: .8;
    }

    .mood-grid {
        display: flex;
        justify-content: space-around;
        margin-top: 25px;
    }

    .mood-btn {
        background: rgba(0, 80, 90, 0.8);
        padding: 18px;
        width: 70px;
        border-radius: 16px;
        text-align: center;
    }

    .mood-btn p {
        margin: 5px 0 0;
        font-size: 14px;
    }

    .player-screen {
        display: none;
        padding-top: 20px;
    }

    .player-card {
        width: 86%;
        margin: auto;
        background: rgba(0,0,0,0.25);
        padding: 20px;
        border-radius: 25px;
        box-shadow: 0 6px 20px rgba(0,0,0,0.5);
    }

    .album-img {
        width: 100%;
        border-radius: 20px;
    }

    .mood-status {
        text-align: center;
        font-size: 26px;
        margin-top: 15px;
        font-weight: 600;
    }

    .player-controls {
        margin-top: 20px;
        display: flex;
        justify-content: center;
        gap: 25px;
    }

    .player-controls button {
        background: #c7ecee;
        border: none;
        padding: 15px;
        width: 55px;
        height: 55px;
        border-radius: 50%;
        font-size: 20px;
        color: #003b44;
        font-weight: 700;
    }

    .progress {
        width: 90%;
        margin: 20px auto;
    }

    .bottom-nav {
        width: 100%;
        position: fixed;
        bottom: 0;
        padding: 15px;
        border-top: 1px solid rgba(255,255,255,0.2);
        display: flex;
        justify-content: space-around;
        background: rgba(0,0,0,0.25);
        backdrop-filter: blur(10px);
    }

    .bottom-nav img {
        width: 40px;
        opacity: .8;
    }

    #cameraBox {
        display: none;
        position: fixed;
        top: 0; left: 0;
        width: 100%; height: 100%;
        background: rgba(0,0,0,0.85);
        backdrop-filter: blur(8px);
        color: white;
        text-align: center;
        padding-top: 80px;
    }

    video {
        width: 85%;
        border-radius: 20px;
        border: 3px solid white;
    }

    #countdown {
        font-size: 50px;
        margin-top: 20px;
    }
</style>
</head>

<body>

<h1>Moodify</h1>

<div id="homeScreen">
    <div class="detect-card" id="detectBtn">
        <div class="detect-icon">📷</div>
        <div class="detect-text">Detect Mood</div>
    </div>

    <h2 class="section-title">Select Manually</h2>

    <div class="mood-grid">
        <div class="mood-btn" onclick="openPlayer('Normal')">🙂<p>Normal</p></div>
        <div class="mood-btn" onclick="openPlayer('Happy')">😊<p>Happy</p></div>
        <div class="mood-btn" onclick="openPlayer('Sad')">😞<p>Sad</p></div>
        <div class="mood-btn" onclick="openPlayer('Chill')">😌<p>Chill</p></div>
    </div>
</div>

<!-- PLAYER -->
<div id="playerScreen" class="player-screen">
    <div class="player-card">
        <img id="albumArt" class="album-img">
        <div id="moodDisplay" class="mood-status">Mood : Normal</div>

        <div class="player-controls">
            <button onclick="prevSong()">⏮</button>
            <button onclick="togglePlay()">▶</button>
            <button onclick="nextSong()">⏭</button>
        </div>

        <input type="range" class="progress" id="progressBar">
    </div>
</div>

    <div class="bottom-nav">   
        <!-- Home Icon -->    
<svg onclick="goHome()" width="35" height="35" viewBox="0 0 24 24" fill="#fff" style="cursor:pointer;">         <path d="M3 9.5L12 3l9 6.5V21a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1V9.5z"/>     </svg>

<!-- Double Music Note Icon -->
<svg onclick="goPlayer()" width="36" height="36" viewBox="0 0 24 24" fill="#fff" style="cursor:pointer;">
    <path d="M9 3v12a3 3 0 1 0 2 2.83V7h6V3H9zm10 4v9a3 3 0 1 0 2 2.83V7h-2z"/>
</s
vg>

<div id="cameraBox">
    <video id="camera" autoplay></video>
    <div id="countdown">5</div>
</div>

<script>

    /* -------------------------
       MOOD-BASED SONG DATABASE
    -----------------------------*/
    let moodSongs = {

        Normal: [
            {url: "song1.mp3", img: "poster1.jpg"},
            {url: "song2.mp3", img: "poster2.jpg"},
            {url: "song3.mp3", img: "poster3.jpg"},
            {url: "song4.mp3", img: "poster4.jpg"},
        ],

        Happy: [
            {url: "happy1.mp3", img: "happyPoster1.jpg"},
            {url: "happy2.mp3", img: "happyPoster2.jpg"},
            {url: "happy3.mp3", img: "happyPoster3.jpg"},
            {url: "happy4.mp3", img: "happyPoster4.jpg"},
        ],

        Sad: [
            {url: "sad1.mp3", img: "sadPoster1.jpg"},
            {url: "sad2.mp3", img: "sadPoster2.jpg"},
            {url: "sad3.mp3", img: "sadPoster3.jpg"},
            {url: "sad4.mp3", img: "sadPoster4.jpg"},
        ],

        Chill: [
            {url: "chill1.mp3", img: "chillPoster1.jpg"},
            {url: "chill2.mp3", img: "chillPoster2.jpg"},
            {url: "chill3.mp3", img: "chillPoster3.jpg"},
            {url: "chill4.mp3", img: "chillPoster4.jpg"},
        ]
    };

    let currentMood = "Normal";
    let currentSong = new Audio();
    let songIndex = 0;

    function goHome() {
        homeScreen.style.display = "block";
        playerScreen.style.display = "none";
    }

    function goPlayer() {
        homeScreen.style.display = "none";
        playerScreen.style.display = "block";
    }

    /* -------------------------
          OPEN PLAYER BY MOOD
    -----------------------------*/
    function openPlayer(mood) {
        currentMood = mood;
        songIndex = 0;

        moodDisplay.innerText = "Mood : " + mood;

        goPlayer();
        playSong();
    }

    /* -------------------------
           PLAY SELECTED SONG
    -----------------------------*/
    function playSong() {
        let songList = moodSongs[currentMood];

        currentSong.src = songList[songIndex].url;
        albumArt.src = songList[songIndex].img;

        currentSong.play();
    }

    function nextSong() {
        let songList = moodSongs[currentMood];

        songIndex = (songIndex + 1) % songList.length;
        playSong();
    }

    function prevSong() {
        let songList = moodSongs[currentMood];

        songIndex = (songIndex - 1 + songList.length) % songList.length;
        playSong();
    }

    function togglePlay() {
        if (currentSong.paused) currentSong.play();
        else currentSong.pause();
    }

    /* -------------------------
           CAMERA MOOD DETECT
    -----------------------------*/
    detectBtn.onclick = async () => {
        cameraBox.style.display = "block";

        let stream = await navigator.mediaDevices.getUserMedia({video:true});
        camera.srcObject = stream;

        let count = 5;
        countdown.innerText = count;

        let interval = setInterval(() => {
            count--;
            countdown.innerText = count;

            if (count === 0) {
                clearInterval(interval);
                stream.getTracks()[0].stop();
                cameraBox.style.display = "none";

                // Fake detection
                let detectedMood = ["Normal","Happy","Sad","Chill"][Math.floor(Math.random()*4)];

                openPlayer(detectedMood);
            }

        }, 1000);
    };
</script>

</body>
</html>
