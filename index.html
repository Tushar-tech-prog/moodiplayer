<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Moodify Random Song Player</title>

<style>
    body {
        background: #0d0d0d;
        background-size: cover;
        background-position: center;
        transition: 0.6s;
        font-family: Arial, sans-serif;
        color: white;
        text-align: center;
        padding: 20px;
    }

    h1 {
        color: #ff0066;
        margin-top: 10px;
    }

    #cameraFeed {
        width: 300px;
        height: 220px;
        border: 2px solid #ff0066;
        border-radius: 10px;
        display: none;
        margin-top: 20px;
    }

    .btn {
        margin-top: 20px;
        padding: 12px 25px;
        border: none;
        font-size: 18px;
        border-radius: 50px;
        background: #ff0066;
        color: white;
        cursor: pointer;
    }
    .btn:hover {
        background: #ff3380;
    }

    #moodText {
        font-size: 26px;
        margin-top: 20px;
        font-weight: bold;
    }

    #songName {
        font-size: 22px;
        margin-top: 10px;
        color: #00ffcc;
    }

    #poster {
        width: 200px;
        height: 200px;
        margin-top: 20px;
        border-radius: 15px;
        box-shadow: 0px 0px 20px #000;
        display: none;
    }
</style>
</head>
<body>

<h1>Moodify – Mood Based Random Music Player</h1>

<button class="btn" id="captureMood">Detect Mood (Camera)</button>

<video id="cameraFeed" autoplay></video>

<div id="moodText">Mood Not Detected</div>

<img id="poster" src="">

<div id="songName"></div>

<audio id="audioPlayer"></audio>

<script>
/* Mood state switching */
let moodToggle = 0;

/* Songs for each mood */
const normalSongs = [
    { src: "song1.mp3", name: "Song 1", poster: "p1.jpg", bg: "bg1.jpg" },
    { src: "song2.mp3", name: "Song 2", poster: "p2.jpg", bg: "bg2.jpg" },
    { src: "song3.mp3", name: "Song 3", poster: "p3.jpg", bg: "bg3.jpg" },
    { src: "song4.mp3", name: "Song 4", poster: "p4.jpg", bg: "bg4.jpg" }
];

const happySongs = [
    { src: "song5.mp3", name: "Song 5", poster: "p5.jpg", bg: "bg5.jpg" },
    { src: "song6.mp3", name: "Song 6", poster: "p6.jpg", bg: "bg6.jpg" },
    { src: "song7.mp3", name: "Song 7", poster: "p7.jpg", bg: "bg7.jpg" },
    { src: "song8.mp3", name: "Song 8", poster: "p8.jpg", bg: "bg8.jpg" }
];

const camera = document.getElementById("cameraFeed");
const moodText = document.getElementById("moodText");
const poster = document.getElementById("poster");
const songName = document.getElementById("songName");
const audioPlayer = document.getElementById("audioPlayer");
const captureBtn = document.getElementById("captureMood");

/* Start camera for 5 seconds */
async function startCamera() {
    try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: true });
        camera.srcObject = stream;
        camera.style.display = "block";

        moodText.textContent = "Detecting Mood…";

        // Stop camera after 5 sec
        setTimeout(() => {
            stopCamera();
            detectMood();
        }, 5000);

    } catch (error) {
        alert("Camera access denied!");
    }
}

/* Stop Camera */
function stopCamera() {
    let stream = camera.srcObject;
    let tracks = stream.getTracks();
    tracks.forEach(track => track.stop());
    camera.style.display = "none";
}

/* Fake Mood Detection Based on Clicks */
function detectMood() {
    let mood = "";

    if (moodToggle === 0) {
        mood = "Normal";
        playRandomSong(normalSongs);
        moodToggle = 1;
    } else {
        mood = "Happy";
        playRandomSong(happySongs);
        moodToggle = 0;
    }

    moodText.textContent = "Mood: " + mood;
}

/* Play Random Song */
function playRandomSong(list) {
    const randomIndex = Math.floor(Math.random() * list.length);
    const song = list[randomIndex];

    audioPlayer.src = song.src;
    audioPlayer.play();

    poster.style.display = "block";
    poster.src = song.poster;

    document.body.style.backgroundImage = `url(${song.bg})`;

    songName.textContent = "Playing: " + song.name;
}

/* Button click event */
captureBtn.addEventListener("click", startCamera);
</script>

</body>
</html>
